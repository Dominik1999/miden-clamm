[package]
name = "basic-wallet"
version = "0.1.0"

[lib]
kind = "account-component"
# Full `miden:<package>/<interface>@<version>` id. The interface segment is the
# kebab-cased component trait name (`BasicWallet` -> `basic-wallet`).
namespace = "miden:basic-wallet/basic-wallet@0.1.0"

[dependencies]
miden-core = "*"
miden-protocol = "*"

[package.metadata.miden]
supported-types = ["RegularAccountUpdatableCode"]
