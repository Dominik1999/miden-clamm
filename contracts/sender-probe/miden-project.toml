[package]
name = "sender-probe"
version = "0.1.0"

[lib]
kind = "account-component"
# Full `miden:<package>/<interface>@<version>` id. The interface segment is the
# kebab-cased component trait name (`SenderProbe` -> `sender-probe`).
namespace = "miden:sender-probe/sender-probe@0.1.0"

[dependencies]
miden-core = "*"
miden-protocol = "*"

[package.metadata.miden]
supported-types = ["RegularAccountImmutableCode"]
